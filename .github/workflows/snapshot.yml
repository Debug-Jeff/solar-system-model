name: Ephemeris snapshot

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephemeris-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build snapshot
        working-directory: backend
        run: go run ./cmd/snapshot -out "$RUNNER_TEMP/data/ephem" -elements "$RUNNER_TEMP/data/smallBodyElements.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ephemeris-snapshot
          path: ${{ runner.temp }}/data
          retention-days: 3

  commit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ephemeris-snapshot
          path: ${{ runner.temp }}/data
      - name: Commit if changed
        run: |
          rm -rf frontend/public/data/ephem
          mkdir -p frontend/public/data/ephem
          cp "$RUNNER_TEMP"/data/ephem/*.json frontend/public/data/ephem/
          cp "$RUNNER_TEMP/data/smallBodyElements.json" frontend/src/ephemeris/data/smallBodyElements.json
          if [ -z "$(git status --porcelain -- frontend/public/data/ephem frontend/src/ephemeris/data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ephem frontend/src/ephemeris/data
          git commit -m "chore(data): refresh ephemeris snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
